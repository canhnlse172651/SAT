name: Bug report
description: Something behaves differently from its spec.
labels: ["bug"]
body:
  - type: input
    id: feature
    attributes:
      label: Feature / acceptance criterion
      description: e.g. `003:AC-2.1` if you know which criterion is violated.
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      description: Release tag or commit, staging or production.
