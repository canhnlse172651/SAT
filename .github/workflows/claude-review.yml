# Independent AI review on every ready PR: spec compliance first, then code quality, then security.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are still in progress; fork PRs have no access to secrets.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Review this pull request in a spec-driven repository. Read CLAUDE.md first.
            1. Find the feature: the head branch (`gh pr view <PR> --json headRefName`) is `feat/NNN-slug` and its
               artifacts live in specs/NNN-slug/. Run `node .sdd/scripts/sdd.mjs check NNN` and `node .sdd/scripts/sdd.mjs trace NNN`.
               If the branch is not a feature branch, review against CLAUDE.md and the constitution only.
            2. Review `git diff BASE...HEAD` exactly as described for the reviewer in .claude/agents/reviewer.md, Mode B:
               stage 1 spec compliance (every AC: implemented? proven by a test that cites it?), then stage 2 code quality.
            3. Apply the checklist in .claude/agents/security-auditor.md to the same diff.
            4. For each concrete issue, post an inline comment (severity, why it matters, suggested fix).
               Report only issues you can point to in the diff. No style nits that a linter would catch.
            5. Finish with one summary comment: AC compliance table, findings by severity, security verdict, and an
               overall verdict PASS / PASS_WITH_WARNINGS / FAIL.
            Do not modify files, commit or push.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(node .sdd/scripts/sdd.mjs:*)"
